# СТП 01-2024 (БГУИР) — параметры оформления.
#
# Значения здесь ПЕРЕКРЫВАЮТ дефолты из preset.py.
# Если чего-то нет — берётся значение из STP2024_PRESET.
#
# Параметры страницы (поля, размер бумаги) здесь НЕ указываются:
# они живут в spec.py и применяются при генерации reference.docx.

[meta]
name = "СТП 01-2024 (БГУИР)"

[headings]
# Список ненумерованных разделов. Используется:
#   • в постобработке (FixSpecialHeadings);
#   • в Lua-фильтрах (01-section-numbers, 03-figure-captions,
#     04-table-captions) через подстановку $special_lua_table.
special = [
    "введение",
    "заключение",
    "содержание",
    "реферат",
    "список использованных источников",
    "перечень условных обозначений",
    "перечень условных обозначений, символов и терминов",
]

# Префикс приложений. Используется в постобработке и в фильтрах.
appendix_prefix = "приложение"

# Буквы для приложений (порядок важен). Подставляется в Lua
# через $app_letters_lua_table.
app_letters = "АБВГДЕЖИКЛМНПРСТУФХЦШЩЭЮЯ"

# Имя стиля для спецзаголовков в reference.docx.
special_style = "SpecialHeading"

[equations]
tab_cm = 16.5

[page_numbers]
align   = "right"
font    = "Times New Roman"
size_pt = 14.0
enabled = true

[toc]
enabled = true
depth   = 2
title   = "СОДЕРЖАНИЕ"

[features]
uppercase_h1       = true
section_numbers    = true
equation_numbers   = true
figure_captions    = true
table_captions     = true
special_headings   = true
field_updates      = true